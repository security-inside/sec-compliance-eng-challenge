<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compliance Evidence Reviewer</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 880px; margin: 3rem auto; padding: 0 1rem; color: #17212b; }
    h1 { margin-bottom: .25rem; } .hint { color: #526170; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.5rem 0; }
    input, button { font: inherit; padding: .65rem .8rem; }
    input { flex: 1 1 220px; } button { cursor: pointer; }
    li { padding: .75rem 0; border-bottom: 1px solid #d9e0e6; }
    code { overflow-wrap: anywhere; } #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Compliance Evidence Reviewer</h1>
  <p class="hint">Local demonstration UI. Reviewer credentials are held in this browser session.</p>
  <form id="query-form">
    <input id="token" type="password" autocomplete="off" placeholder="Viewer bearer token" required aria-label="Viewer bearer token">
    <input id="server" placeholder="Server identifier" value="demo-linux-01" required aria-label="Server identifier">
    <button type="submit">Load snapshots</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="results"></ul>
  <script>
    const api = 'http://localhost:8000';
    const form = document.querySelector('#query-form');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); results.replaceChildren(); status.textContent = 'Loading…';
      const token = document.querySelector('#token').value;
      const server = document.querySelector('#server').value;
      try {
        const response = await fetch(`${api}/v1/servers/${encodeURIComponent(server)}/snapshots`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const snapshots = await response.json();
        status.textContent = `${snapshots.length} snapshot(s)`;
        for (const snapshot of snapshots) {
          const item = document.createElement('li');
          const text = document.createElement('p');
          text.textContent = `${snapshot.collected_at} · execution ${snapshot.execution_id} · SHA-256 ${snapshot.sha256}`;
          item.append(text);
          if (snapshot.csv_available) {
            const button = document.createElement('button');
            button.textContent = 'Download CSV';
            button.addEventListener('click', async () => {
              const download = await fetch(`${api}/v1/servers/${encodeURIComponent(server)}/snapshots/${encodeURIComponent(snapshot.execution_id)}/csv`, {
                headers: { Authorization: `Bearer ${token}` }
              });
              if (!download.ok) { status.textContent = `Download failed (${download.status})`; return; }
              const anchor = document.createElement('a');
              anchor.href = URL.createObjectURL(await download.blob());
              anchor.download = `${snapshot.execution_id}.csv`; anchor.click(); URL.revokeObjectURL(anchor.href);
            });
            item.append(button);
          }
          results.append(item);
        }
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
